<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="hi, i'm verity. building sonify">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b14"/>
      <stop offset="1" stop-color="#151026"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 50% { transform: translateY(-6px); } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow1)"/>
  <rect width="1200" height="300" rx="20" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="70" y="118" class="mono" font-size="20" fill="#8b8ba7">~/verityzs $ whoami</text>
  <text x="70" y="182" class="t" font-size="58" font-weight="800" fill="#f5f5fa">hi, i'm <tspan fill="url(#accent)">verity</tspan>.</text>
  <text x="70" y="230" class="mono" font-size="22" fill="#c4c4d8">building <tspan fill="#a78bfa" font-weight="700">sonify</tspan><tspan class="cursor" fill="#f472b6">▍</tspan></text>

  <g class="float" transform="translate(930 150)">
    <circle r="78" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.6"/>
    <circle r="56" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08"/>
    <text y="18" text-anchor="middle" class="t" font-size="54" font-weight="800" fill="url(#accent)">V</text>
  </g>
</svg>
